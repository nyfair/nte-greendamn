name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Prepare
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Compile
      run: |
        rustup set profile minimal
        rustup update
        cargo build --release
        move target\release\nte_greendamn.dll .\nte-greendamn.asi
        cargo build --release --features spine
        mkdir live2d
        move target\release\nte_greendamn.dll live2d\nte-greendamn.asi
        cargo build --release --features vehicle
        mkdir driver
        move target\release\nte_greendamn.dll driver\nte-greendamn.asi
        cargo build --release --features spine,vehicle
        mkdir live2d+driver
        move target\release\nte_greendamn.dll live2d+driver\nte-greendamn.asi
    - name: Upload
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: nte-greendamn.asi
        tag: latest
        overwrite: true
    - name: Upload Live2D
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: live2d\nte-greendamn.asi
        tag: latest_live2d
        overwrite: true
    - name: Upload Driver
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: driver\nte-greendamn.asi
        tag: latest_driver
        overwrite: true
    - name: Upload Live2D+Driver
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: live2d+driver\nte-greendamn.asi
        tag: latest_live2d_driver
        overwrite: true
